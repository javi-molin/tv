
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>Guía de TV Chile</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #191a20;
      --panel2: #22242c;
      --text: #f5f5f7;
      --muted: #a4a6b2;
      --accent: #a6f36b;
      --line: #30323b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      padding: 26px clamp(16px, 4vw, 48px) 20px;
      border-bottom: 1px solid var(--line);
      background: #141519;
    }

    .topline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 38px);
      letter-spacing: -1.2px;
    }

    .live-label {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.4px;
    }

    #updated {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 22px;
    }

    .filter {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      padding: 9px 15px;
      cursor: pointer;
      font-size: 13px;
    }

    .filter.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #101114;
      font-weight: 800;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px clamp(12px, 3vw, 32px) 60px;
    }

    .section-heading {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 16px;
    }

    h2 { margin: 0; font-size: 21px; }

    .muted { color: var(--muted); font-size: 13px; }

    .channel-section { margin: 28px 0; }

    .channel-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
      font-size: 17px;
    }

    .channel-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 auto;
    }

    .program-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 235px), 1fr));
      gap: 10px;
    }

    .program {
      display: block;
      width: 100%;
      min-height: 112px;
      text-align: left;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      transition: border-color .15s, transform .15s, background .15s;
    }

    .program:hover, .program:focus-visible {
      border-color: var(--accent);
      background: var(--panel2);
      transform: translateY(-2px);
      outline: none;
    }

    .program-time {
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 9px;
    }

    .program-name {
      font-size: 16px;
      line-height: 1.35;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .program-hint {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .empty, .notice {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      color: var(--muted);
      line-height: 1.6;
    }

    .notice { margin-bottom: 18px; }

    footer {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--line);
    }

    dialog {
      width: min(560px, calc(100% - 28px));
      max-height: min(85vh, 760px);
      overflow: auto;
      padding: 0;
      border: 1px solid #41434e;
      border-radius: 22px;
      background: #191a20;
      color: var(--text);
      box-shadow: 0 24px 100px #000b;
    }

    dialog::backdrop {
      background: #000b;
      backdrop-filter: blur(5px);
    }

    .modal-content { padding: 25px; }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
    }

    .modal-channel {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #modalTitle {
      margin: 9px 0 12px;
      font-size: clamp(24px, 5vw, 32px);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .close {
      border: 0;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      background: var(--panel2);
      color: var(--text);
      font-size: 23px;
      cursor: pointer;
    }

    .modal-meta {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    #modalSummary {
      margin: 20px 0;
      line-height: 1.7;
      white-space: pre-line;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 12px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }

    .action-primary {
      background: var(--accent);
      color: #101114;
    }

    .action-secondary {
      border: 1px solid var(--line);
      color: var(--text);
      background: var(--panel2);
    }

    .hidden { display: none !important; }

    @media (max-width: 500px) {
      header { padding-top: 20px; }
      .program-list { grid-template-columns: 1fr; }
      .program { min-height: 95px; }
      .modal-content { padding: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topline">
      <h1>Guía de TV Chile</h1>
      <span class="live-label">● TELEVISIÓN ABIERTA</span>
    </div>
    <div id="updated">Cargando programación…</div>

    <nav class="filters" aria-label="Filtrar canales">
      <button class="filter active" data-channel="Todos">Todos</button>
      <button class="filter" data-channel="Mega">Mega</button>
      <button class="filter" data-channel="Chilevisión">Chilevisión</button>
      <button class="filter" data-channel="Canal 13">Canal 13</button>
      <button class="filter" data-channel="TVN">TVN</button>
    </nav>
  </header>

  <main>
    <div id="statusNotice" class="notice hidden"></div>
    <div class="section-heading">
      <h2>Programación disponible</h2>
      <span class="muted" id="itemCount"></span>
    </div>
    <div id="schedule">
      <div class="empty">Cargando los datos de la guía…</div>
    </div>
  </main>

  <footer>
    Guía informativa independiente. La programación puede cambiar según el canal.
  </footer>

  <dialog id="programModal" aria-labelledby="modalTitle">
    <div class="modal-content">
      <div class="modal-top">
        <div>
          <div class="modal-channel" id="modalChannel"></div>
          <h2 id="modalTitle"></h2>
        </div>
        <button class="close" id="closeModal" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-meta" id="modalMeta"></div>
      <p id="modalSummary"></p>
      <div class="modal-actions">
        <a class="action action-primary" id="watchLive" href="#" target="_blank"
           rel="noopener noreferrer">Ver aquí ↗</a>
        <a class="action action-secondary hidden" id="officialInfo" href="#"
           target="_blank" rel="noopener noreferrer">Más información ↗</a>
      </div>
    </div>
  </dialog>

  <script>
    const DATA_URL = "./data/tv-data.json";

    const LIVE_URLS = {
      "Mega": "https://www.mega.cl/senal-en-vivo/",
      "Chilevisión": "https://www.chilevision.cl/senal-online/",
      "Canal 13": "https://www.13.cl/",
      "TVN": "https://www.tvn.cl/en-vivo"
    };

    // Solo se muestran resúmenes generales para programas reconocidos.
    // Si no hay información suficiente, la ficha lo indica sin inventar detalles.
    const PROGRAM_DETAILS = {
      "mucho gusto": "Programa matinal con actualidad, entrevistas y conversación sobre los temas del día.",
      "meganoticias amanece": "Espacio informativo con noticias y los primeros acontecimientos de la jornada.",
      "meganoticias alerta": "Noticiero con información de actualidad nacional e internacional.",
      "meganoticias prime": "Edición central de noticias con los principales acontecimientos del día.",
      "contigo en la mañana": "Matinal de actualidad, noticias, entrevistas y temas ciudadanos.",
      "contigo en directo": "Programa de actualidad que aborda noticias, temas políticos y policiales.",
      "plan perfecto": "Espacio de entretención y espectáculos.",
      "sabingo": "Programa familiar que recorre historias, tradiciones y lugares de Chile.",
      "buenos días a todos": "Matinal de TVN con actualidad, entrevistas y conversación.",
      "el medio día": "Programa de actualidad, conversación y temas de interés general.",
      "la hora de jugar": "Programa de entretención y concursos.",
      "dale play": "Programa de entretención y concursos musicales."
    };

    let allItems = [];
    let selectedChannel = "Todos";

    const scheduleEl = document.getElementById("schedule");
    const modal = document.getElementById("programModal");

    function normalize(value) {
      return String(value || "").trim().toLocaleLowerCase("es-CL")
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function parseTime(value) {
      const match = String(value || "").match(/(?:^|\D)([01]?\d|2[0-3]):([0-5]\d)(?:\D|$)/);
      if (!match) return null;
      return Number(match[1]) * 60 + Number(match[2]);
    }

    function todayChile() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Santiago",
        year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(new Date());
      const get = type => parts.find(part => part.type === type)?.value;
      return `${get("year")}-${get("month")}-${get("day")}`;
    }

    function cleanItems(rawItems) {
      const today = todayChile();
      const result = [];
      const seen = new Set();

      for (const raw of rawItems) {
        if (!raw || typeof raw !== "object") continue;

        const channel = String(raw.channel || "").trim();
        const title = String(raw.title || "").trim();
        const time = String(raw.time || "").trim();
        const minutes = parseTime(time);
        const date = String(raw.date || "").slice(0, 10);

        if (!channel || !title || minutes === null) continue;
        if (!Object.hasOwn(LIVE_URLS, channel)) continue;
        if (date && /^\d{4}-\d{2}-\d{2}$/.test(date) && date !== today) continue;

        // Evita registros repetidos exactos, pero no elimina programas distintos
        // que legítimamente comiencen a la misma hora.
        const key = [channel, title, time, date].join("|").toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);

        result.push({
          channel,
          title,
          time: time.match(/[0-2]?\d:[0-5]\d/)?.[0] || time,
          minutes,
          date,
          summary: String(raw.summary || raw.description || "").trim(),
          source_url: safeHttpURL(raw.source_url || raw.url || "")
        });
      }

      result.sort((a, b) =>
        a.channel.localeCompare(b.channel, "es") ||
        a.minutes - b.minutes ||
        a.title.localeCompare(b.title, "es")
      );

      return result;
    }

    function safeHttpURL(value) {
      try {
        const url = new URL(value);
        return ["https:", "http:"].includes(url.protocol) ? url.href : "";
      } catch {
        return "";
      }
    }

    function render() {
      const filtered = allItems.filter(item =>
        selectedChannel === "Todos" || item.channel === selectedChannel
      );

      document.getElementById("itemCount").textContent =
        `${filtered.length} ${filtered.length === 1 ? "programa" : "programas"}`;

      if (!filtered.length) {
        scheduleEl.innerHTML = `
          <div class="empty">
            No hay horarios válidos para mostrar${selectedChannel !== "Todos"
              ? ` en ${escapeHTML(selectedChannel)}` : ""}.
            La guía no inventa programas cuando no logra obtener la parrilla oficial.
            Vuelve a intentarlo cuando se actualicen los datos.
          </div>`;
        return;
      }

      const channels = selectedChannel === "Todos"
        ? ["Mega", "Chilevisión", "Canal 13", "TVN"]
        : [selectedChannel];

      scheduleEl.innerHTML = channels.map(channel => {
        const items = filtered.filter(item => item.channel === channel);
        if (!items.length) return "";

        return `
          <section class="channel-section">
            <h3 class="channel-title">
              <span class="channel-dot"></span>${escapeHTML(channel)}
            </h3>
            <div class="program-list">
              ${items.map((item, index) => `
                <button class="program" type="button"
                  data-channel="${escapeHTML(item.channel)}"
                  data-title="${escapeHTML(item.title)}"
                  data-time="${escapeHTML(item.time)}"
                  data-summary="${escapeHTML(item.summary)}"
                  data-source="${escapeHTML(item.source_url)}"
                  aria-label="Ver detalles de ${escapeHTML(item.title)}">
                  <span class="program-time">${escapeHTML(item.time)}</span>
                  <span class="program-name">${escapeHTML(item.title)}</span>
                  <span class="program-hint">Ver detalles del programa ↗</span>
                </button>
              `).join("")}
            </div>
          </section>`;
      }).join("");

      scheduleEl.querySelectorAll(".program").forEach(button => {
        button.addEventListener("click", () => openProgram(button.dataset));
      });
    }

    function openProgram(item) {
      const channel = item.channel || "";
      const title = item.title || "Programa";
      const knownSummary = PROGRAM_DETAILS[normalize(title)];
      const summary = item.summary || knownSummary ||
        "No hay un resumen verificado disponible para este programa. Puedes consultar la información oficial del canal.";

      document.getElementById("modalChannel").textContent = channel;
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalMeta").textContent =
        `Horario publicado: ${item.time || "No informado"} · Canal: ${channel}`;
      document.getElementById("modalSummary").textContent = summary;

      document.getElementById("watchLive").href =
        LIVE_URLS[channel] || "https://www.tvn.cl/en-vivo";

      const infoLink = document.getElementById("officialInfo");
      const sourceURL = safeHttpURL(item.source || "");
      if (sourceURL) {
        infoLink.href = sourceURL;
        infoLink.classList.remove("hidden");
      } else {
        infoLink.classList.add("hidden");
        infoLink.removeAttribute("href");
      }

      if (typeof modal.showModal === "function") {
        modal.showModal();
      } else {
        alert(`${title}\n${channel} · ${item.time}\n\n${summary}`);
      }
    }

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        selectedChannel = button.dataset.channel;
        document.querySelectorAll(".filter").forEach(other => {
          other.classList.toggle("active", other === button);
        });
        render();
      });
    });

    document.getElementById("closeModal").addEventListener("click", () => modal.close());

    modal.addEventListener("click", event => {
      if (event.target === modal) modal.close();
    });

    async function loadSchedule() {
      try {
        const response = await fetch(`${DATA_URL}?t=${Date.now()}`, {
          cache: "no-store"
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        allItems = cleanItems(Array.isArray(data.schedule_items)
          ? data.schedule_items : []);

        const dateText = data.updated_at
          ? ` · Actualizado: ${new Date(data.updated_at).toLocaleString("es-CL", {
              timeZone: "America/Santiago",
              dateStyle: "short", timeStyle: "short"
            })}`
          : "";

        document.getElementById("updated").textContent =
          `${data.status || "Programación cargada"}${dateText}`;

        const badChannels = Array.isArray(data.channel_status)
          ? data.channel_status.filter(item =>
              item.status && !["ok", "success"].includes(item.status))
          : [];

        const notice = document.getElementById("statusNotice");
        if (badChannels.length) {
          notice.textContent = "No se pudo confirmar la programación de todos los canales. " +
            "Los horarios ausentes no se completan con datos inventados.";
          notice.classList.remove("hidden");
        } else {
          notice.classList.add("hidden");
        }

        render();
      } catch (error) {
        document.getElementById("updated").textContent =
          "No se pudieron cargar los datos de la programación.";
        scheduleEl.innerHTML = `
          <div class="empty">
            Hubo un problema al leer data/tv-data.json.
            Revisa que el archivo exista y que la acción de GitHub haya terminado correctamente.
          </div>`;
        console.error("Error cargando programación:", error);
      }
    }

    loadSchedule();
  </script>
</body>
</html>
