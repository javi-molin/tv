
name: Actualizar datos de TV

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos-tv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recopilar información
        run: python scripts/update_data.py

      - name: Guardar datos actualizados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar datos de televisión"
          file_pattern: "data/tv-data.json"
